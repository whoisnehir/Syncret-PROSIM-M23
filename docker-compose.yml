services:
  # ---------- SQL SERVER ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: syncret-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - syncret-sqldata:/var/opt/mssql
    networks:
      - syncret-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- INIT SCHEMA (rulează o dată, apoi se oprește) ----------
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: syncret-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/scripts
    networks:
      - syncret-net
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/init.sql
      "
  # ---------- API (ASP.NET Core 8) ----------
  api:
    build:
      context: ./SyncretAPI
      dockerfile: Dockerfile
    container_name: syncret-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SyncretDB=Server=sqlserver,1433;Database=SyncretDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;Connect Timeout=30;
    ports:
      - "8080:8080"
    networks:
      - syncret-net

  # ---------- FRONTEND (nginx) ----------
  web:
    build:
      context: ./SyncretWeb
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: syncret-web
    depends_on:
      - api
    ports:
      - "8081:80"
    networks:
      - syncret-net

networks:
  syncret-net:
    driver: bridge

volumes:
  syncret-sqldata: